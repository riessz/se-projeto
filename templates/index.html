<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IBMEC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #fff; min-height: 100vh; }
        
        header {
            background: #1a1d27;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2d3148;
        }
        header h1 { font-size: 22px; color: #4f9cf9; }
        header span { font-size: 13px; color: #888; }
        
        .container { padding: 30px 40px; }
        
        h2 { font-size: 16px; color: #888; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .salas { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 40px; }
        
        .sala-card {
            background: #1a1d27;
            border-radius: 12px;
            padding: 24px;
            width: 280px;
            border: 2px solid #2d3148;
            transition: all 0.3s;
        }
        .sala-card.alerta { border-color: #ff4d4d; box-shadow: 0 0 20px rgba(255,77,77,0.2); }
        .sala-card.chamado { border-color: #f9a825; box-shadow: 0 0 20px rgba(249,168,37,0.2); }
        
        .sala-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sala-nome { font-size: 18px; font-weight: bold; }
        .sala-badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-normal { background: #1a3a2a; color: #4caf50; }
        .badge-alerta { background: #3a1a1a; color: #ff4d4d; }
        .badge-chamado { background: #3a2a1a; color: #f9a825; }
        
        .temp-display { display: flex; gap: 15px; margin-bottom: 16px; }
        .temp-box {
            flex: 1;
            background: #0f1117;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .temp-box .valor { font-size: 28px; font-weight: bold; color: #4f9cf9; }
        .temp-box .label { font-size: 11px; color: #888; margin-top: 4px; }
        
        .chamado-info {
            background: #2a2010;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #f9a825;
            display: none;
        }
        .chamado-info.ativo { display: block; }
        
        .ultimo-chamado { font-size: 12px; color: #666; margin-top: 10px; }

        .historico-table {
            background: #1a1d27;
            border-radius: 12px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #2d3148;
            padding: 14px 20px;
            text-align: left;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #2d3148; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #1f2235; }
        
        .status-pill {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            background: #1a2a3a;
            color: #4f9cf9;
        }

        #clock { font-size: 13px; color: #4f9cf9; }
    </style>
</head>
<body>

<header>
    <h1>🏫 Dashboard IBMEC — Sistema de Chamados</h1>
    <div>
        <span id="clock"></span>
    </div>
</header>

<div class="container">
    <h2>Salas — Andar 1</h2>
    <div class="salas" id="salas-container">
        <!-- Cards gerados pelo JS -->
    </div>

    <h2>Histórico de Chamados</h2>
    <div class="historico-table">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Sala</th>
                    <th>Tipo</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="historico-body">
                <tr><td colspan="4" style="color:#666; text-align:center;">Nenhum chamado ainda.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const socket = io();

    // Relógio
    function atualizarRelogio() {
        const agora = new Date();
        document.getElementById('clock').textContent = agora.toLocaleTimeString('pt-BR');
    }
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();

    // Busca estado inicial
    fetch('/api/estado')
        .then(r => r.json())
        .then(data => renderizar(data));

    // Atualização em tempo real
    socket.on('atualizar', function(data) {
        renderizar(data);
    });

    function renderizar(data) {
        // Cards das salas
        const container = document.getElementById('salas-container');
        container.innerHTML = '';
        for (const [id, sala] of Object.entries(data.salas)) {
            const classeCard = sala.chamado_ativo ? 'chamado' : (sala.status === 'alerta' ? 'alerta' : '');
            const badgeClasse = sala.chamado_ativo ? 'badge-chamado' : (sala.status === 'alerta' ? 'badge-alerta' : 'badge-normal');
            const badgeTexto = sala.chamado_ativo ? '🔔 CHAMADO' : (sala.status === 'alerta' ? '⚠️ ALERTA' : '✅ NORMAL');

            container.innerHTML += `
                <div class="sala-card ${classeCard}">
                    <div class="sala-header">
                        <span class="sala-nome">${sala.nome}</span>
                        <span class="sala-badge ${badgeClasse}">${badgeTexto}</span>
                    </div>
                    <div class="temp-display">
                        <div class="temp-box">
                            <div class="valor">${sala.temperatura}°</div>
                            <div class="label">Temperatura</div>
                        </div>
                        <div class="temp-box">
                            <div class="valor">${sala.umidade}%</div>
                            <div class="label">Umidade</div>
                        </div>
                    </div>
                    <div class="chamado-info ${sala.chamado_ativo ? 'ativo' : ''}">
                        🔔 Chamado ativo: <strong>${sala.tipo_chamado}</strong>
                    </div>
                    <div class="ultimo-chamado">Último chamado: ${sala.ultimo_chamado}</div>
                </div>
            `;
        }

        // Histórico
        const tbody = document.getElementById('historico-body');
        if (data.historico.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="color:#666; text-align:center;">Nenhum chamado ainda.</td></tr>';
        } else {
            tbody.innerHTML = data.historico.map(h => `
                <tr>
                    <td>${h.hora}</td>
                    <td>${h.sala}</td>
                    <td>${h.tipo}</td>
                    <td><span class="status-pill">${h.status}</span></td>
                </tr>
            `).join('');
        }
    }
</script>

</body>
</html>
