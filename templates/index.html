<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Chamados — IBMEC</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0e0f13;
      --surface: #16181f;
      --surface2:#1d2028;
      --border:  #272a33;
      --text:    #e8eaf0;
      --muted:   #6b7080;
      --blue:    #4a8cff;
      --green:   #3ecf84;
      --red:     #e05454;
      --orange:  #e08a3c;
      --radius:  8px;
    }

    html, body { min-height:100vh; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; line-height:1.5; }

    header {
      position:sticky; top:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between;
      padding:0 32px; height:60px;
      background:var(--surface); border-bottom:1px solid var(--border);
    }
    .header-left { display:flex; align-items:center; gap:20px; }
    .logo-text { font-size:18px; font-weight:700; letter-spacing:.12em; color:var(--blue); text-transform:uppercase; }
    .divider-v { width:1px; height:22px; background:var(--border); }
    .header-title { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; }
    .header-right { display:flex; align-items:center; gap:24px; }
    #clock { font-family:'DM Mono',monospace; font-size:13px; color:var(--muted); letter-spacing:.06em; }
    .conn-badge { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
    .conn-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    main { max-width:1200px; margin:0 auto; padding:32px; }

    .section-label {
      font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
      color:var(--muted); margin-bottom:16px; display:flex; align-items:center; gap:10px;
    }
    .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

    .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:28px; }
    .kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
    .kpi-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
    .kpi-value { font-size:28px; font-weight:600; line-height:1; color:var(--text); }
    .kpi-value.green  { color:var(--green); }
    .kpi-value.red    { color:var(--red); }
    .kpi-value.orange { color:var(--orange); }

    .search-row { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
    .search-input {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      padding:8px 14px; font-size:13px; color:var(--text); font-family:'DM Sans',sans-serif;
      width:260px; outline:none; transition:border-color .2s;
    }
    .search-input::placeholder { color:var(--muted); }
    .search-input:focus { border-color:var(--blue); }
    .search-msg { font-size:12px; color:var(--muted); padding:10px 0; display:none; }
    .search-msg.visible { display:block; }
    .search-msg.warn { color:var(--red); }

    .salas-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; margin-bottom:36px; }

    .sala-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; transition:border-color .2s; }
    .sala-card.alerta    { border-color:var(--red); }
    .sala-card.chamado   { border-color:var(--orange); animation:cardGlow 2s infinite; }
    .sala-card.resolvido { border-color:var(--green); }

    .sala-card.alerta    .card-top-bar { background:var(--red); }
    .sala-card.chamado   .card-top-bar { background:var(--orange); }
    .sala-card.resolvido .card-top-bar { background:var(--green); }

    .card-top-bar { height:3px; background:var(--border); transition:background .3s; }

    .card-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px; cursor:pointer; user-select:none;
    }
    .card-header-left { display:flex; align-items:center; gap:10px; }
    .sala-name { font-size:15px; font-weight:600; }

    .status-tag {
      font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
      padding:3px 9px; border-radius:20px; border:1px solid currentColor;
    }
    .tag-normal    { color:var(--green);  border-color:var(--green);  background:rgba(62,207,132,.08); }
    .tag-chamado   { color:var(--orange); border-color:var(--orange); background:rgba(224,138,60,.10); }
    .tag-alerta    { color:var(--red);    border-color:var(--red);    background:rgba(224,84,84,.10); }
    .tag-resolvido { color:var(--green);  border-color:var(--green);  background:rgba(62,207,132,.08); }
    .tag-pendente  { color:var(--muted);  border-color:var(--muted);  background:rgba(107,112,128,.10); }

    .toggle-btn {
      background:none; border:none; color:var(--muted); cursor:pointer;
      font-size:16px; line-height:1; padding:2px 4px; transition:transform .2s;
    }
    .toggle-btn.collapsed { transform:rotate(-90deg); }

    .card-body { padding:0 16px 16px; overflow:hidden; transition:max-height .3s ease, padding .3s ease; max-height:600px; }
    .card-body.collapsed { max-height:0; padding-top:0; padding-bottom:0; }

    .metrics-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .metric-box { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px 14px; }
    .metric-val { font-size:26px; font-weight:600; font-family:'DM Mono',monospace; line-height:1; color:var(--blue); }
    .metric-val.warn { color:var(--red); }
    .metric-lbl { font-size:11px; color:var(--muted); margin-top:4px; }

    .temp-bar-wrap { margin-bottom:14px; }
    .temp-bar-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-bottom:4px; }
    .temp-bar-track { height:4px; background:var(--border); border-radius:4px; overflow:hidden; position:relative; }
    .temp-bar-zone { position:absolute; top:0; bottom:0; left:25%; width:20%; background:rgba(62,207,132,.25); }
    .temp-bar-fill { position:absolute; top:0; bottom:0; left:0; background:var(--blue); border-radius:4px; transition:width .6s ease; }

    .chamado-info {
      background:rgba(224,138,60,.07); border:1px solid rgba(224,138,60,.25);
      border-radius:6px; padding:10px 12px; font-size:12px; color:var(--orange); display:none;
    }
    .chamado-info.visible { display:block; }
    .chamado-info strong { color:var(--text); }

    .meta-row {
      display:flex; justify-content:space-between; font-size:11px; color:var(--muted);
      margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
    }

    .pendentes-section { margin-bottom:36px; }
    .pendente-card {
      background:var(--surface); border:1px solid rgba(224,84,84,.3);
      border-left:3px solid var(--red); border-radius:var(--radius); padding:16px 18px; margin-bottom:8px;
    }
    .pendente-header { display:grid; grid-template-columns:1fr auto; align-items:center; margin-bottom:10px; }
    .pendente-title { font-weight:600; font-size:13px; color:var(--text); }
    .pendente-meta  { font-size:11px; color:var(--muted); margin-top:2px; }
    .pendente-time  { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); text-align:right; }
    .pendente-actions { display:flex; gap:8px; margin-top:12px; }
    .btn-email {
      background:rgba(74,140,255,.12); border:1px solid rgba(74,140,255,.3);
      color:var(--blue); border-radius:6px; padding:6px 14px; font-size:12px;
      cursor:pointer; font-family:'DM Sans',sans-serif; transition:background .2s;
    }
    .btn-email:hover { background:rgba(74,140,255,.22); }
    .btn-email.sent  { background:rgba(62,207,132,.12); border-color:rgba(62,207,132,.3); color:var(--green); cursor:default; }

    .pendente-desc-label { font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    .pendente-desc {
      background:var(--surface2); border:1px solid var(--border);
      border-left:2px solid var(--red); border-radius:4px;
      padding:10px 12px; font-size:12px; color:var(--text); line-height:1.6;
    }

    .empty-state { padding:20px; text-align:center; color:var(--muted); font-size:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }

    .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    thead th { padding:11px 16px; text-align:left; font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:var(--surface2); border-bottom:1px solid var(--border); }
    tbody tr { border-bottom:1px solid var(--border); transition:background .15s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--surface2); }
    tbody td { padding:12px 16px; font-size:13px; vertical-align:top; }

    .pill { display:inline-block; font-size:10px; font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:20px; text-transform:uppercase; }
    .pill-waiting   { color:var(--muted);  background:var(--surface2); }
    .pill-active    { color:var(--orange); background:rgba(224,138,60,.12); }
    .pill-resolved  { color:var(--green);  background:rgba(62,207,132,.12); }
    .pill-failed    { color:var(--red);    background:rgba(224,84,84,.12); }
    .pill-escalated { color:var(--blue);   background:rgba(74,140,255,.12); }
    .pill-none      { color:var(--red);    background:rgba(224,84,84,.12); }

    .mono { font-family:'DM Mono',monospace; font-size:12px; }
    .motivo-cell { font-size:11px; color:var(--muted); margin-top:4px; font-style:italic; }

    @keyframes cardGlow {
      0%,100% { box-shadow:0 0 0 0 rgba(224,138,60,0); }
      50%      { box-shadow:0 0 18px 2px rgba(224,138,60,.18); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="logo-text">ibmec</span>
    <div class="divider-v"></div>
    <span class="header-title">Sistema de Chamados</span>
  </div>
  <div class="header-right">
    <div class="conn-badge"><div class="conn-dot"></div><span>Online</span></div>
    <span id="clock">--:--:--</span>
  </div>
</header>

<main>

  <div class="section-label">Resumo</div>
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">Total de Chamados</div><div class="kpi-value" id="kpi-total">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Resolvidos</div><div class="kpi-value green" id="kpi-resolvidos">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Não Resolvidos</div><div class="kpi-value red" id="kpi-nao-resolvidos">0</div></div>
    <div class="kpi-card"><div class="kpi-label">Escalados</div><div class="kpi-value orange" id="kpi-escalados">0</div></div>
  </div>

  <div class="section-label">Salas — Andar 1</div>
  <div class="search-row">
    <input class="search-input" id="search-salas" type="text" placeholder="Pesquisar sala..." />
    <span class="search-msg" id="search-salas-msg"></span>
  </div>
  <div class="salas-grid" id="salas-container"></div>

  <div class="pendentes-section">
    <div class="section-label">Pendentes</div>
    <div class="search-row">
      <input class="search-input" id="search-pendentes" type="text" placeholder="Pesquisar sala..." />
      <span class="search-msg" id="search-pendentes-msg"></span>
    </div>
    <div id="pendentes-container"><div class="empty-state">Nenhum chamado pendente.</div></div>
  </div>

  <div class="section-label">Histórico de Chamados</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Abertura</th><th>Sala</th><th>Tipo</th><th>Funcionário</th><th>Duração</th><th>Status / Descrição</th>
        </tr>
      </thead>
      <tbody id="historico-body">
        <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Nenhum chamado registrado.</td></tr>
      </tbody>
    </table>
  </div>

</main>

<script>
  const socket = io();
  let _data = null;
  const collapsed = new Set();
  const emailsSent = new Set();

  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR');
  }, 1000);

  fetch('/api/estado').then(r => r.json()).then(d => { _data = d; render(d); });
  socket.on('atualizar', d => { _data = d; render(d); });

  function stripEmoji(s) {
    if (!s) return '';
    return s.replace(/[\u{1F000}-\u{1FFFF}]/gu, '').replace(/[\uFE00-\uFE0F]/gu, '').trim();
  }

  function tempClass(v) {
    const n = parseFloat(v);
    return (!isNaN(n) && (n < 20 || n > 24)) ? 'warn' : '';
  }

  function tempBarWidth(v) {
    const n = parseFloat(v);
    if (isNaN(n)) return '0%';
    return Math.min(100, Math.max(0, ((n - 15) / 20) * 100)).toFixed(1) + '%';
  }

  function isTempAlerta(sala) {
    const t = parseFloat(sala.temperatura);
    return !isNaN(t) && (t < 20 || t > 24);
  }

  function cardClass(sala) {
    if (sala.chamado_ativo) return 'chamado';
    if (isTempAlerta(sala)) return 'alerta';
    const sit = (sala.situacao || '').toLowerCase();
    if (sit.includes('resolvido') && !sit.includes('nao') && !sit.includes('não')) return 'resolvido';
    return '';
  }

  function statusTag(sala) {
    if (sala.chamado_ativo) return { cls:'tag-chamado', txt:'Chamado Ativo' };
    if (isTempAlerta(sala)) return { cls:'tag-alerta', txt:'Temp. Irregular' };
    const sit = (sala.situacao || '').toLowerCase();
    if (sit.includes('resolvido') && !sit.includes('nao') && !sit.includes('não')) return { cls:'tag-resolvido', txt:'Resolvido' };
    if (sit.includes('pendente') || sit.includes('nao resolvido') || sit.includes('não resolvido')) return { cls:'tag-pendente', txt:'Pendente' };
    return { cls:'tag-normal', txt:'Normal' };
  }

  function pillClass(situacao) {
    const s = (situacao || '').toLowerCase();
    if (s.includes('aguardando'))     return 'pill-waiting';
    if (s.includes('em atendimento')) return 'pill-active';
    if (s.includes('resolvido') && !s.includes('nao') && !s.includes('não')) return 'pill-resolved';
    if (s.includes('nao resolvido') || s.includes('não resolvido') || s.includes('pendente')) return 'pill-failed';
    if (s.includes('escalado'))       return 'pill-escalated';
    if (s.includes('sem atendimento'))return 'pill-none';
    return 'pill-waiting';
  }

  document.getElementById('search-salas').addEventListener('input', function() {
    if (_data) renderSalas(_data, this.value.trim());
  });

  document.getElementById('search-pendentes').addEventListener('input', function() {
    if (_data) renderPendentes(_data, this.value.trim());
  });

  function render(data) {
    const e = data.estatisticas || {};
    document.getElementById('kpi-total').textContent          = e.total_chamados || 0;
    document.getElementById('kpi-resolvidos').textContent     = e.resolvidos      || 0;
    document.getElementById('kpi-nao-resolvidos').textContent = e.nao_resolvidos  || 0;
    document.getElementById('kpi-escalados').textContent      = e.escalados       || 0;

    renderSalas(data, document.getElementById('search-salas').value.trim());
    renderPendentes(data, document.getElementById('search-pendentes').value.trim());
    renderHistorico(data);
  }

  function toggleSala(id) {
    if (collapsed.has(id)) collapsed.delete(id);
    else collapsed.add(id);
    if (_data) renderSalas(_data, document.getElementById('search-salas').value.trim());
  }

  function renderSalas(data, query) {
    const cont = document.getElementById('salas-container');
    const msg  = document.getElementById('search-salas-msg');
    msg.className = 'search-msg'; msg.textContent = '';

    const salas = Object.entries(data.salas || {});

    if (query) {
      const q = query.toLowerCase().replace(/\s/g,'');
      const existe = salas.some(([,s]) => s.nome.toLowerCase().replace(/\s/g,'').includes(q));
      if (!existe) {
        msg.textContent = `A sala "${query}" não existe no sistema.`;
        msg.className = 'search-msg visible warn';
        cont.innerHTML = ''; return;
      }
    }

    const filtradas = query
      ? salas.filter(([,s]) => s.nome.toLowerCase().replace(/\s/g,'').includes(query.toLowerCase().replace(/\s/g,'')))
      : salas;

    cont.innerHTML = '';
    filtradas.forEach(([id, sala]) => {
      const tag  = statusTag(sala);
      const cc   = cardClass(sala);
      const tc   = tempClass(sala.temperatura);
      const bw   = tempBarWidth(sala.temperatura);
      const mini = collapsed.has(id);
      const showInfo = sala.chamado_ativo || (sala.situacao && sala.situacao !== '--');

      let infoText = '';
      if (sala.chamado_ativo) {
        infoText = `Chamado ativo: <strong>${sala.tipo_chamado}</strong>`;
        if (sala.funcionario_atual && sala.funcionario_atual !== '--')
          infoText += ` &mdash; ${sala.funcionario_atual}`;
      } else if (sala.situacao && sala.situacao !== '--') {
        infoText = `<strong>${stripEmoji(sala.situacao)}</strong>`;
        if (sala.funcionario_atual && sala.funcionario_atual !== '--')
          infoText += ` &mdash; ${sala.funcionario_atual}`;
      }

      cont.innerHTML += `
        <div class="sala-card ${cc}">
          <div class="card-top-bar"></div>
          <div class="card-header" onclick="toggleSala('${id}')">
            <div class="card-header-left">
              <div class="sala-name">${sala.nome}</div>
              <span class="status-tag ${tag.cls}">${tag.txt}</span>
            </div>
            <button class="toggle-btn ${mini ? 'collapsed' : ''}" title="${mini ? 'Expandir' : 'Minimizar'}">&#9660;</button>
          </div>
          <div class="card-body ${mini ? 'collapsed' : ''}">
            <div class="metrics-row">
              <div class="metric-box">
                <div class="metric-val ${tc}">${sala.temperatura !== '--' ? sala.temperatura + '°C' : '—'}</div>
                <div class="metric-lbl">Temperatura</div>
              </div>
              <div class="metric-box">
                <div class="metric-val">${sala.umidade !== '--' ? sala.umidade + '%' : '—'}</div>
                <div class="metric-lbl">Umidade</div>
              </div>
            </div>
            <div class="temp-bar-wrap">
              <div class="temp-bar-labels"><span>15°C</span><span>Faixa normal: 20–24°C</span><span>35°C</span></div>
              <div class="temp-bar-track">
                <div class="temp-bar-zone"></div>
                <div class="temp-bar-fill" style="width:${bw}"></div>
              </div>
            </div>
            <div class="chamado-info ${showInfo ? 'visible' : ''}">${infoText}</div>
            <div class="meta-row">
              <span>Último chamado: ${sala.ultimo_chamado !== '--' ? sala.ultimo_chamado : '—'}</span>
              ${sala.tempo_atendimento && sala.tempo_atendimento !== '--' ? `<span class="mono">${sala.tempo_atendimento}</span>` : ''}
            </div>
          </div>
        </div>`;
    });
  }

  function renderPendentes(data, query) {
    const pc  = document.getElementById('pendentes-container');
    const msg = document.getElementById('search-pendentes-msg');
    msg.className = 'search-msg'; msg.textContent = '';

    const pend = data.pendentes || [];

    if (query) {
      const q = query.toLowerCase().replace(/\s/g,'');
      const salaExiste = Object.values(data.salas || {}).some(s => s.nome.toLowerCase().replace(/\s/g,'').includes(q));
      if (!salaExiste) {
        msg.textContent = `A sala "${query}" não existe no sistema.`;
        msg.className = 'search-msg visible warn';
        pc.innerHTML = ''; return;
      }
      const filtrados = pend.filter(p => (p.sala || '').toLowerCase().replace(/\s/g,'').includes(q));
      if (!filtrados.length) {
        msg.textContent = `A sala "${query}" não possui pendências.`;
        msg.className = 'search-msg visible';
        pc.innerHTML = ''; return;
      }
      pc.innerHTML = filtrados.map((p, i) => renderPendenteCard(p, i)).join('');
      return;
    }

    if (!pend.length) {
      pc.innerHTML = '<div class="empty-state">Nenhum chamado pendente.</div>';
    } else {
      pc.innerHTML = pend.map((p, i) => renderPendenteCard(p, i)).join('');
    }
  }

  function renderPendenteCard(p, idx) {
    const sent = emailsSent.has(idx);
    return `
      <div class="pendente-card">
        <div class="pendente-header">
          <div>
            <div class="pendente-title">${p.sala || '—'} &mdash; ${p.tipo || '—'}</div>
            <div class="pendente-meta">Funcionário: ${p.funcionario || '—'} &nbsp;|&nbsp; Duração: ${p.tempo_atendimento || '—'}</div>
          </div>
          <div class="pendente-time">${p.hora || '—'}</div>
        </div>
        ${p.motivo && p.motivo !== '--' ? `
          <div class="pendente-desc-label">Descrição do problema</div>
          <div class="pendente-desc">${p.motivo}</div>
        ` : ''}
        <div class="pendente-actions">
          <button class="btn-email ${sent ? 'sent' : ''}" onclick="reenviarEmail(${idx})" ${sent ? 'disabled' : ''}>
            ${sent ? 'Email enviado' : 'Reenviar por email'}
          </button>
        </div>
      </div>`;
  }

  function reenviarEmail(idx) {
    if (!_data) return;
    const p = _data.pendentes[idx];
    if (!p) return;
    fetch('/api/reenviar_email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    }).then(r => r.json()).then(res => {
      if (res.ok) {
        emailsSent.add(idx);
        renderPendentes(_data, document.getElementById('search-pendentes').value.trim());
      }
    }).catch(e => console.error(e));
  }

  function renderHistorico(data) {
    const hist  = data.historico || [];
    const tbody = document.getElementById('historico-body');
    if (!hist.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Nenhum chamado registrado.</td></tr>';
      return;
    }
    tbody.innerHTML = hist.map(h => {
      const sit    = h.situacao || '';
      const motivo = h.motivo_falha && h.motivo_falha !== '--' ? h.motivo_falha : null;
      return `
        <tr>
          <td class="mono">${h.hora_abertura || '—'}</td>
          <td>${h.sala || '—'}</td>
          <td>${h.tipo || '—'}</td>
          <td>${h.funcionario || '—'}</td>
          <td class="mono">${h.tempo_atendimento && h.tempo_atendimento !== '--' ? h.tempo_atendimento : '—'}</td>
          <td>
            <span class="pill ${pillClass(sit)}">${stripEmoji(sit) || 'Aguardando'}</span>
            ${motivo ? `<div class="motivo-cell">${motivo}</div>` : ''}
          </td>
        </tr>`;
    }).join('');
  }
</script>
</body>
</html>
